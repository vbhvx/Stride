version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stride-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: stride_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stride-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/stride_dev"
      AI_PROVIDER: "mock"
      NODE_ENV: "production"
    depends_on:
      - postgres

volumes:
  postgres_data:

